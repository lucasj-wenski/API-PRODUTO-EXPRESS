<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de produtos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="banner">
        <img src="/img/imagem.jpeg" alt="Logo do cadastro" class="banner-img">
    </div>
    <div class="banner-titulo">Lucas José Wenski</div>

    <div class="container">
        <header class="user-bar">
            <span id="usuario-atual">Verificando sessão...</span>
            <button id="btn-logout" class="btn-secundario" type="button">Sair</button>
        </header>
        <h1>Cadastro de Produtos</h1>
        <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
        <form id="produto-form">

            <label>Nome do Produto: </label>
            <input type="text" required id="nome" placeholder="Digite o nome do produto">

            <label>Preço: </label>
            <input type="number" required id="preco" min="0.01" step="0.01" placeholder="0.00">

            <label>Quantidade: </label>
            <input type="number" required id="quantidade" min="1" step="1" placeholder="1">

            <button type="submit" class="btn-adicionar">Adicionar Produto</button>
        
        </form>

        <button id="limpar-tabela" class="btn-limpar">Limpar Tabela</button>

        <h3 id="total-estoque" class="total-estoque">Total em estoque: R$ 0,00</h3>

        <table id="tabela-produtos">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                    <th>Total Bruto</th>
                    <th id="coluna-acoes" hidden>Ação</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
