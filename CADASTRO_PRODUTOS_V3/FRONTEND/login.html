<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Acessar | Cadastro de Produtos</title>
	<link rel="stylesheet" href="style.css">
</head>
<body class="pagina-login">
	<main class="login-container">
		<p class="login-eyebrow">GESTÃO DE ESTOQUE</p>
		<h1>Acesse sua conta</h1>
		<p class="login-subtitulo">Entre ou crie uma conta para continuar.</p>

		<div class="login-tabs" role="tablist" aria-label="Acesso">
			<button id="tab-entrar" class="login-tab ativo" type="button" role="tab" aria-selected="true">Entrar</button>
			<button id="tab-cadastrar" class="login-tab" type="button" role="tab" aria-selected="false">Criar conta</button>
		</div>

		<form id="login-form">
			<label for="email">E-mail</label>
			<input id="email" name="email" type="email" autocomplete="email" required placeholder="voce@exemplo.com">

			<label id="nome-label" for="nome" hidden>Nome</label>
			<input id="nome" name="nome" type="text" autocomplete="name" placeholder="Seu nome" hidden>

			<label for="senha">Senha</label>
			<input id="senha" name="senha" type="password" autocomplete="current-password" minlength="6" required placeholder="Mínimo de 6 caracteres">

			<button id="submit-login" class="btn-adicionar" type="submit">Entrar</button>
		</form>
		<p id="login-mensagem" class="mensagem" role="status" aria-live="polite"></p>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script>
		const form = document.getElementById('login-form');
		const nomeInput = document.getElementById('nome');
		const nomeLabel = document.getElementById('nome-label');
		const senhaInput = document.getElementById('senha');
		const submitButton = document.getElementById('submit-login');
		const mensagem = document.getElementById('login-mensagem');
		const tabEntrar = document.getElementById('tab-entrar');
		const tabCadastrar = document.getElementById('tab-cadastrar');
		let modo = 'entrar';
		let clienteSupabase;

		function definirModo(novoModo) {
			modo = novoModo;
			const cadastrar = modo === 'cadastrar';
			nomeInput.hidden = !cadastrar;
			nomeLabel.hidden = !cadastrar;
			nomeInput.required = cadastrar;
			senhaInput.autocomplete = cadastrar ? 'new-password' : 'current-password';
			submitButton.textContent = cadastrar ? 'Criar conta' : 'Entrar';
			tabEntrar.classList.toggle('ativo', !cadastrar);
			tabCadastrar.classList.toggle('ativo', cadastrar);
			tabEntrar.setAttribute('aria-selected', String(!cadastrar));
			tabCadastrar.setAttribute('aria-selected', String(cadastrar));
			mensagem.textContent = '';
			mensagem.classList.remove('erro');
		}

		tabEntrar.addEventListener('click', () => definirModo('entrar'));
		tabCadastrar.addEventListener('click', () => definirModo('cadastrar'));

		async function iniciarLogin() {
			try {
				const resposta = await fetch('/config');
				const config = await resposta.json();
				if (!resposta.ok) throw new Error(config.erro || 'Configuração indisponível.');
				clienteSupabase = window.supabase.createClient(config.url, config.anonKey);

				const { data } = await clienteSupabase.auth.getSession();
				if (data.session) window.location.replace('/');
			} catch (erro) {
				mensagem.textContent = erro.message;
				mensagem.classList.add('erro');
			}
		}

		form.addEventListener('submit', async (event) => {
			event.preventDefault();
			submitButton.disabled = true;
			mensagem.textContent = '';
			mensagem.classList.remove('erro');

			try {
				const email = document.getElementById('email').value.trim();
				const password = senhaInput.value;
				let resultado;

				if (modo === 'cadastrar') {
					resultado = await clienteSupabase.auth.signUp({
						email,
						password,
						options: { data: { full_name: nomeInput.value.trim() } }
					});
				} else {
					resultado = await clienteSupabase.auth.signInWithPassword({ email, password });
				}

				if (resultado.error) throw resultado.error;

				if (modo === 'cadastrar' && !resultado.data.session) {
					mensagem.textContent = 'Conta criada. Confirme seu e-mail e depois entre.';
				} else {
					window.location.assign('/');
				}
			} catch (erro) {
				mensagem.textContent = erro.message || 'Não foi possível autenticar.';
				mensagem.classList.add('erro');
			} finally {
				submitButton.disabled = false;
			}
		});

		iniciarLogin();
	</script>
</body>
</html>
